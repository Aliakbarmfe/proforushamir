<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پشتیبانی و گفتگو</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: #f4f6f9; color: #333; height: 100vh; display: flex; flex-direction: column; }

    /* هدر */
    header {
      background: #007bff;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
    header h2 { font-size: 1.1rem; }

    /* باکس گفتگو */
    .chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #007bff;
      color: white;
      border-bottom-left-radius: 2px;
    }
    .msg.admin {
      align-self: flex-start;
      background: #e9ecef;
      color: #333;
      border-bottom-right-radius: 2px;
    }
    .msg img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .download-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.15);
      color: inherit;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    /* فرم ارسال پیام */
    .chat-input-area {
      background: white;
      padding: 12px 15px;
      border-top: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .chat-input-area textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      resize: none;
      height: 45px;
    }
    .chat-input-area input[type="file"] { display: none; }
    .file-btn {
      background: #6c757d;
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .send-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .preview-info { font-size: 0.75rem; color: #666; display: none; }
  </style>
</head>
<body>

  <!-- هدر -->
  <header>
    <button class="back-btn" onclick="window.location.href='index.html'">➔</button>
    <h2>پشتیبانی و گفتگو با مدیر</h2>
  </header>

  <!-- چت روم -->
  <div class="chat-container" id="chatContainer">
    <p style="text-align: center; color: #777;">در حال بارگذاری پیام‌ها...</p>
  </div>

  <!-- بخش ارسال -->
  <div class="chat-input-area">
    <div class="preview-info" id="filePreviewInfo">تصویر انتخاب شد</div>
    <div class="input-row">
      <label for="imgUpload" class="file-btn">📷</label>
      <input type="file" id="imgUpload" accept="image/*" onchange="handleFileSelect()">
      <textarea id="msgText" placeholder="پیام خود را بنویسید..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('user'));

    // بررسی ورود کاربر
    if (!currentUser) {
      alert('لطفاً ابتدا ثبت نام یا ورود کنید.');
      window.location.href = 'index.html';
    }

    // بررسی پارامتر ارسال رسید از خرید
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('action') === 'receipt') {
      setTimeout(() => {
        document.getElementById('msgText').value = 'با سلام، رسید پرداخت جهت بررسی ارسال شد:';
      }, 500);
    }

    function handleFileSelect() {
      const file = document.getElementById('imgUpload').files[0];
      const info = document.getElementById('filePreviewInfo');
      if (file) {
        info.style.display = 'block';
        info.innerText = `تصویر انتخاب شد: ${file.name}`;
      } else {
        info.style.display = 'none';
      }
    }

    async function apiFirebase(path, method = 'GET', data = null) {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) options.body = JSON.stringify(data);
      const res = await fetch(`/api/firebase?path=${path}`, options);
      return res.json();
    }

    async function uploadToImgBB(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
          try {
            const res = await fetch('/api/imgbb', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ image: reader.result })
            });
            const data = await res.json();
            if (data.success) resolve(data.data.url);
            else reject('خطا در آپلود عکس');
          } catch (e) { reject(e); }
        };
      });
    }

    window.onload = () => {
      loadMessages();
      setInterval(loadMessages, 5000); // بروزرسانی خودکار هر ۵ ثانیه
    };

    async function loadMessages() {
      const container = document.getElementById('chatContainer');
      const messages = await apiFirebase(`messages/${currentUser.username}`) || {};
      container.innerHTML = '';

      const keys = Object.keys(messages);
      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#777;">پیامی وجود ندارد. پیام خود را بفرستید.</p>';
        return;
      }

      keys.forEach(k => {
        const m = messages[k];
        const isUser = m.sender !== 'admin';
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isUser ? 'user' : 'admin'}`;
        
        let html = `<div>${m.text || ''}</div>`;
        if (m.img) {
          html += `
            <img src="${m.img}" alt="تصویر">
            <a href="${m.img}" target="_blank" download class="download-btn">⬇ دانلود تصویر</a>
          `;
        }

        msgDiv.innerHTML = html;
        container.appendChild(msgDiv);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const textInput = document.getElementById('msgText');
      const fileInput = document.getElementById('imgUpload');
      const btn = document.getElementById('sendBtn');

      const text = textInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return alert('لطفاً متن یا تصویر وارد کنید.');

      btn.disabled = true;
      btn.innerText = 'در حال ارسال...';

      try {
        let imgUrl = '';
        if (file) {
          imgUrl = await uploadToImgBB(file);
        }

        const msgData = {
          sender: currentUser.username,
          text,
          img: imgUrl,
          timestamp: Date.now()
        };

        await apiFirebase(`messages/${currentUser.username}`, 'POST', msgData);

        textInput.value = '';
        fileInput.value = '';
        document.getElementById('filePreviewInfo').style.display = 'none';

        loadMessages();
      } catch (e) {
        alert('خطا در ارسال پیام: ' + e);
      } finally {
        btn.disabled = false;
        btn.innerText = 'ارسال';
      }
    }
  </script>
</body>
</html>

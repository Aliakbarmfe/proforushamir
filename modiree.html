<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { 
      background: linear-gradient(to bottom, #14192C, #0B0E1A); 
      color: #D1D5DB; 
      padding-bottom: 20px; 
      min-height: 100vh;
    }

    /* هدر مدیریت */
    header {
      background: #1C2033;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #2E344D;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .header-left-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .btn-logout {
      background: #dc3545;
      color: white;
      border: 1px solid #2E344D;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background: #bd2130;
    }

    /* کانتینر اصلی و چیدمان تک ستونی (یک دکمه در هر ردیف) */
    .container { 
      padding: 20px; 
      max-width: 500px; 
      margin: 40px auto; 
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      width: 100%;
    }

    /* هم‌اندازه کردن و استایل دکمه‌های اصلی */
    .main-btn {
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      border: 1px solid #2E344D;
      border-radius: 8px;
      background: #4F6BF5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: background 0.2s, transform 0.1s;
    }
    .main-btn:active {
      transform: scale(0.98);
    }
    .main-btn.stats { background: #4F6BF5; }
    .main-btn.count { background: #1C2033; color: #5E81FF; cursor: default; }
    .main-btn.ads { background: #4F6BF5; }
    .main-btn.private { background: #4F6BF5; }
    .main-btn.public { background: #4F6BF5; color: #fff; }
    .main-btn.msg { background: #4F6BF5; }

    /* لیست محصولات داخل پاپ آپ */
    .product-item {
      background: #0B0E1A;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      border: 1px solid #2E344D;
      color: #D1D5DB;
    }
    .product-item img { width: 70px; height: 70px; border-radius: 6px; object-fit: cover; border: 1px solid #2E344D; }
    .product-details { flex-grow: 1; text-align: right; }
    .product-title { font-weight: bold; font-size: 0.95rem; color: #5E81FF; }
    .product-price { color: #D1D5DB; font-size: 0.85rem; margin-top: 4px; }
    .actions { display: flex; gap: 8px; }
    .btn-sm {
      padding: 6px 10px;
      border: 1px solid #2E344D;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #fff;
    }
    .btn-edit { background: #4F6BF5; color: #fff; }
    .btn-del { background: #dc3545; }

    /* پاپ آپ‌ها */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 26, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal {
      background: #1C2033;
      border: 1px solid #2E344D;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      color: #D1D5DB;
    }

    /* پاپ آپ ۹۰ درصدی برای مدیریت آگهی‌ها */
    .modal-90 {
      max-width: none;
      width: 90vw;
      height: 90vh;
      max-height: 90vh;
    }

    .modal h3 { margin-bottom: 15px; text-align: center; color: #5E81FF; }
    .modal input, .modal textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #0B0E1A;
      border: 1px solid #2E344D;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #D1D5DB;
    }
    .modal label { font-size: 0.8rem; color: #D1D5DB; margin-bottom: 4px; display: block; }
    .modal-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #2E344D;
      border-radius: 6px;
      background: #4F6BF5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 5px;
    }
    .close-modal {
      position: absolute;
      top: 10px; left: 10px;
      border: none; background: none;
      font-size: 1.2rem; cursor: pointer;
      color: #D1D5DB;
    }

    .list-item {
      background: #0B0E1A;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #2E344D;
      color: #D1D5DB;
    }
    
    .chat-box {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #2E344D;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      background: #0B0E1A;
      display: flex;
      flex-direction: column;
    }
    .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; max-width: 80%; }
    .msg.user { background: #2E344D; color: #D1D5DB; align-self: flex-start; }
    .msg.admin { background: #4F6BF5; color: #fff; align-self: flex-end; text-align: right; }
    .msg img { max-width: 100%; border-radius: 4px; margin-top: 5px; display: block; border: 1px solid #2E344D; }
  </style>
</head>
<body>

  <!-- هدر پنل مدیریت -->
  <header>
    <!-- بالای سایت سمت چپ: دکمه خروج -->
    <div class="header-left-group">
      <button class="btn-logout" onclick="logoutAdmin()">خروج از پنل</button>
    </div>
  </header>

  <!-- کانتینر اصلی محتوای صفحه شامل دکمه‌ها در ردیف‌های مجزا -->
  <div class="container">
    <div class="buttons-grid">
      <!-- 1. آمار کاربران -->
      <button class="main-btn stats" onclick="openUserStatsModal()">آمار کاربران</button>
      
      <!-- 2. تعداد آگهی -->
      <button class="main-btn count">تعداد آگهی: <span id="mainAdsCount" style="margin-right: 5px;">0</span></button>
      
      <!-- 3. مدیریت آگهی -->
      <button class="main-btn ads" onclick="openAdsManagerModal()">مدیریت آگهی</button>
      
      <!-- 4. ارسال پیام به کاربر -->
      <button class="main-btn private" onclick="openUsersModalForNotice()">ارسال پیام به کاربر</button>
      
      <!-- 5. پیام همگانی -->
      <button class="main-btn public" onclick="openPublicNoticeModal()">پیام همگانی</button>
      
      <!-- 6. پیام‌های پشتیبانی -->
      <button class="main-btn msg" onclick="openUserMessagesModal()">پیام های پشتیبانی</button>
    </div>
  </div>

  <!-- پاپ آپ آمار کاربران -->
  <div class="modal-overlay" id="userStatsModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('userStatsModal')">✕</button>
      <h3>آمار کاربران</h3>
      <div id="userStatsContent" style="margin-bottom: 15px; font-weight: bold; color: #5E81FF;"></div>
      <div id="userStatsList">در حال بارگذاری...</div>
    </div>
  </div>

  <!-- پاپ آپ مدیریت آگهی (۹۰ درصد صفحه) -->
  <div class="modal-overlay" id="adsManagerModal">
    <div class="modal modal-90">
      <button class="close-modal" onclick="closeModal('adsManagerModal')">✕</button>
      <h3>مدیریت آگهی‌ها</h3>
      <button class="modal-btn" style="background:#4F6BF5; margin-bottom:15px;" onclick="openAddProductModal()">+ افزودن محصول جدید</button>
      <div id="adminProductsList">در حال بارگذاری...</div>
    </div>
  </div>

  <!-- پاپ آپ افزودن/ویرایش محصول -->
  <div class="modal-overlay" id="productModal" style="z-index: 1100;">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('productModal')">✕</button>
      <h3 id="productModalTitle">افزودن محصول</h3>
      <input type="hidden" id="editProductId">
      <input type="text" id="pTitle" placeholder="نام محصول">
      <input type="number" id="pPrice" placeholder="قیمت محصول (تومان)">
      
      <label>عکس اصلی محصول:</label>
      <input type="file" id="pMainImgFile" accept="image/*">
      
      <label>عکس‌های اضافی محصول (چندتایی):</label>
      <input type="file" id="pExtraImgFiles" accept="image/*" multiple>

      <textarea id="pDesc" placeholder="توضیحات اضافی"></textarea>
      <input type="text" id="pCardNum" placeholder="شماره کارت">
      <input type="text" id="pCardName" placeholder="نام صاحب کارت">
      <input type="text" id="pRubika" placeholder="آیدی روبیکای صاحب محصول">
      
      <button class="modal-btn" id="saveProductBtn" onclick="saveProduct()">ثبت محصول</button>
    </div>
  </div>

  <!-- پاپ آپ ارسال اعلان عمومی -->
  <div class="modal-overlay" id="publicNoticeModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('publicNoticeModal')">✕</button>
      <h3>ارسال اعلان عمومی</h3>
      <textarea id="publicNoticeText" placeholder="متن اعلان عمومی برای همه کاربران..."></textarea>
      <button class="modal-btn" onclick="sendPublicNotice()">ارسال همگانی</button>
    </div>
  </div>

  <!-- پاپ آپ لیست کاربران (برای ارسال اعلان خصوصی) -->
  <div class="modal-overlay" id="usersModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('usersModal')">✕</button>
      <h3>انتخاب کاربر جهت ارسال اعلان</h3>
      <div id="usersListContainer">در حال بارگذاری...</div>
    </div>
  </div>

  <!-- پاپ آپ ارسال اعلان شخصی -->
  <div class="modal-overlay" id="privateNoticeModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('privateNoticeModal')">✕</button>
      <h3>ارسال اعلان شخصی به <span id="targetUserSpan"></span></h3>
      <textarea id="privateNoticeText" placeholder="متن پیام شخصی..."></textarea>
      <button class="modal-btn" onclick="sendPrivateNotice()">ارسال اعلان</button>
    </div>
  </div>

  <!-- پاپ آپ پیام‌های کاربران (ارسال پیام به کاربر) -->
  <div class="modal-overlay" id="userMessagesModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('userMessagesModal')">✕</button>
      <h3>پیام‌های کاربران</h3>
      <div id="userMsgListContainer">در حال بارگذاری...</div>
    </div>
  </div>

  <!-- پاپ آپ گفتگو و پاسخ به پیام کاربر -->
  <div class="modal-overlay" id="replyModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('replyModal')">✕</button>
      <h3>گفتگو با <span id="replyUserSpan"></span></h3>
      <div class="chat-box" id="chatBox"></div>
      <textarea id="replyText" placeholder="متن پاسخ..."></textarea>
      <label>ارسال عکس پاسخ (اختیاری):</label>
      <input type="file" id="replyImgFile" accept="image/*">
      <button class="modal-btn" id="sendReplyBtn" onclick="sendReply()">ارسال پاسخ</button>
    </div>
  </div>

  <script>
    // احراز هویت اولیه مدیر
    if (sessionStorage.getItem('adminAuthenticated') !== 'true') {
      window.location.href = 'index.html';
    }

    // جلوگیری از برگشت با مرورگر
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.pushState(null, null, location.href);
      alert("برای خروج از پنل مدیریت از دکمه خروج بالای صفحه استفاده کنید.");
    };

    // تابع خروج اختصاصی از پنل
    function logoutAdmin() {
      if (confirm("آیا برای خروج از پنل مدیریت اطمینان دارید؟")) {
        window.onbeforeunload = null;
        sessionStorage.removeItem('adminAuthenticated');
        window.location.href = 'index.html';
      }
    }

    window.onbeforeunload = function() {
      return "آیا مطمئن هستید؟";
    };

    let selectedTargetUser = null;

    // توابع واسطه API
    async function apiFirebase(path, method = 'GET', data = null) {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) options.body = JSON.stringify(data);
      const res = await fetch(`/api/firebase?path=${path}`, options);
      return res.json();
    }

    async function uploadToImgBB(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
          try {
            const res = await fetch('/api/imgbb', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ image: reader.result })
            });
            const data = await res.json();
            if (data.success) resolve(data.data.url);
            else reject('خطا در آپلود عکس');
          } catch (e) { reject(e); }
        };
      });
    }

    window.onload = () => {
      updateAdsCount();
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // بروزرسانی تعداد آگهی‌ها
    async function updateAdsCount() {
      const products = await apiFirebase('products') || {};
      const count = Object.keys(products).length;
      document.getElementById('mainAdsCount').innerText = count;
    }

    // آمار کاربران
    async function openUserStatsModal() {
      openModal('userStatsModal');
      const container = document.getElementById('userStatsList');
      const statsContent = document.getElementById('userStatsContent');
      container.innerHTML = 'در حال بارگذاری...';
      statsContent.innerHTML = '';
      
      const users = await apiFirebase('users') || {};
      const keys = Object.keys(users);
      statsContent.innerText = `تعداد کل کاربران: ${keys.length} نفر`;
      container.innerHTML = '';

      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#D1D5DB;">کاربری ثبت نشده است.</p>';
        return;
      }

      keys.forEach(u => {
        const usr = users[u];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.cursor = 'default';
        item.innerHTML = `
          <div>
            <div><strong>نام:</strong> ${usr.name || 'ثبت نشده'}</div>
            <div><strong>نام کاربری:</strong> ${usr.username || u}</div>
            <div style="font-size:0.85rem; color:#dc3545;"><strong>رمز عبور:</strong> ${usr.password || 'ندارد'}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // پاپ آپ مدیریت آگهی‌ها (۹۰٪ صفحه)
    function openAdsManagerModal() {
      openModal('adsManagerModal');
      loadAdminProducts();
    }

    // مدیریت محصولات
    async function loadAdminProducts() {
      const container = document.getElementById('adminProductsList');
      const products = await apiFirebase('products') || {};
      container.innerHTML = '';
      const keys = Object.keys(products);

      document.getElementById('mainAdsCount').innerText = keys.length;

      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#D1D5DB;">محصولی وجود ندارد.</p>';
        return;
      }

      keys.forEach(id => {
        const p = products[id];
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <img src="${p.mainImage}" alt="${p.title}">
          <div class="product-details">
            <div class="product-title">${p.title}</div>
            <div class="product-price">${p.price} تومان</div>
          </div>
          <div class="actions">
            <button class="btn-sm btn-edit" onclick="editProduct('${id}')">ویرایش</button>
            <button class="btn-sm btn-del" onclick="deleteProduct('${id}')">حذف</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function openAddProductModal() {
      document.getElementById('productModalTitle').innerText = 'افزودن محصول';
      document.getElementById('editProductId').value = '';
      document.getElementById('pTitle').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pCardNum').value = '';
      document.getElementById('pCardName').value = '';
      document.getElementById('pRubika').value = '';
      openModal('productModal');
    }

    async function editProduct(id) {
      const p = await apiFirebase(`products/${id}`);
      if (!p) return;
      document.getElementById('productModalTitle').innerText = 'ویرایش محصول';
      document.getElementById('editProductId').value = id;
      document.getElementById('pTitle').value = p.title;
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pDesc').value = p.desc || '';
      document.getElementById('pCardNum').value = p.cardNumber || '';
      document.getElementById('pCardName').value = p.cardName || '';
      document.getElementById('pRubika').value = p.rubika || '';
      openModal('productModal');
    }

    async function saveProduct() {
      const btn = document.getElementById('saveProductBtn');
      const id = document.getElementById('editProductId').value;
      const title = document.getElementById('pTitle').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const desc = document.getElementById('pDesc').value.trim();
      const cardNumber = document.getElementById('pCardNum').value.trim();
      const cardName = document.getElementById('pCardName').value.trim();
      const rubika = document.getElementById('pRubika').value.trim();

      const mainImgFile = document.getElementById('pMainImgFile').files[0];
      const extraImgFiles = document.getElementById('pExtraImgFiles').files;

      if (!title || !price) return alert('نام و قیمت محصول الزامی است');

      btn.disabled = true;
      btn.innerText = 'در حال پردازش و آپلود عکس‌ها...';

      try {
        let existing = id ? await apiFirebase(`products/${id}`) : {};
        let mainImage = existing.mainImage || '';
        let extraImages = existing.extraImages || [];

        if (mainImgFile) {
          mainImage = await uploadToImgBB(mainImgFile);
        } else if (!id) {
          btn.disabled = false;
          btn.innerText = 'ثبت محصول';
          return alert('انتخاب عکس اصلی برای محصول جدید الزامی است');
        }

        if (extraImgFiles.length > 0) {
          extraImages = [];
          for (let f of extraImgFiles) {
            const url = await uploadToImgBB(f);
            extraImages.push(url);
          }
        }

        const productData = { title, price, mainImage, extraImages, desc, cardNumber, cardName, rubika };

        if (id) {
          await apiFirebase(`products/${id}`, 'PATCH', productData);
        } else {
          await apiFirebase('products', 'POST', productData);
        }

        closeModal('productModal');
        loadAdminProducts();
        alert('محصول با موفقیت ذخیره شد');
      } catch (err) {
        alert('خطا در ذخیره‌سازی محصول: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'ثبت محصول';
      }
    }

    async function deleteProduct(id) {
      if (confirm('آیا از حذف این محصول اطمینان دارید؟')) {
        await apiFirebase(`products/${id}`, 'DELETE');
        loadAdminProducts();
      }
    }

    // اعلان عمومی
    function openPublicNoticeModal() { openModal('publicNoticeModal'); }
    async function sendPublicNotice() {
      const text = document.getElementById('publicNoticeText').value.trim();
      if (!text) return alert('متن اعلان را وارد کنید');
      await apiFirebase('notices/public', 'POST', { text, timestamp: Date.now() });
      document.getElementById('publicNoticeText').value = '';
      closeModal('publicNoticeModal');
      alert('اعلان عمومی ارسال شد');
    }

    // کاربران و اعلان شخصی
    async function openUsersModalForNotice() {
      openModal('usersModal');
      const container = document.getElementById('usersListContainer');
      container.innerHTML = 'در حال بارگذاری...';
      const users = await apiFirebase('users') || {};
      container.innerHTML = '';

      Object.keys(users).forEach(u => {
        const usr = users[u];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.onclick = () => openPrivateNoticeModal(usr.username || u);
        item.innerHTML = `
          <div>
            <strong>${usr.name || 'بدون نام'}</strong> (${usr.username || u})
          </div>
          <span style="font-size:0.8rem; color:#5E81FF;">انتخاب ›</span>
        `;
        container.appendChild(item);
      });
    }

    function openPrivateNoticeModal(username) {
      selectedTargetUser = username;
      document.getElementById('targetUserSpan').innerText = username;
      closeModal('usersModal');
      openModal('privateNoticeModal');
    }

    async function sendPrivateNotice() {
      const text = document.getElementById('privateNoticeText').value.trim();
      if (!text || !selectedTargetUser) return alert('متن پیام را وارد کنید');
      await apiFirebase(`notices/private/${selectedTargetUser}`, 'POST', { text, timestamp: Date.now() });
      document.getElementById('privateNoticeText').value = '';
      closeModal('privateNoticeModal');
      alert('اعلان شخصی ارسال شد');
    }

    // پیام‌های کاربران (ارسال پیام به کاربر)
    async function openUserMessagesModal() {
      openModal('userMessagesModal');
      const container = document.getElementById('userMsgListContainer');
      container.innerHTML = 'در حال بارگذاری...';
      const messages = await apiFirebase('messages') || {};
      container.innerHTML = '';

      const usersWhoSentMsg = Object.keys(messages);
      if (usersWhoSentMsg.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#D1D5DB;">هیچ پیامی دریافت نشده است.</p>';
        return;
      }

      usersWhoSentMsg.forEach(u => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.onclick = () => openReplyModal(u);
        item.innerHTML = `
          <strong>گفتگو با ${u}</strong>
          <span style="font-size:0.8rem; color:#5E81FF;">مشاهده و پاسخ ›</span>
        `;
        container.appendChild(item);
      });
    }

    async function openReplyModal(username) {
      selectedTargetUser = username;
      document.getElementById('replyUserSpan').innerText = username;
      closeModal('userMessagesModal');
      openModal('replyModal');
      loadChat();
    }

    async function loadChat() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = 'در حال بارگذاری گفتگو...';
      const msgs = await apiFirebase(`messages/${selectedTargetUser}`) || {};
      chatBox.innerHTML = '';

      Object.values(msgs).forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.sender === 'admin' ? 'admin' : 'user'}`;
        div.innerHTML = `
          <div>${m.text || ''}</div>
          ${m.img ? `<img src="${m.img}">` : ''}
        `;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      const imgFile = document.getElementById('replyImgFile').files[0];
      const btn = document.getElementById('sendReplyBtn');

      if (!text && !imgFile) return alert('متن یا تصویر را وارد کنید');

      btn.disabled = true;
      btn.innerText = 'در حال ارسال...';

      try {
        let img = '';
        if (imgFile) img = await uploadToImgBB(imgFile);

        await apiFirebase(`messages/${selectedTargetUser}`, 'POST', {
          sender: 'admin',
          text,
          img,
          timestamp: Date.now()
        });

        document.getElementById('replyText').value = '';
        document.getElementById('replyImgFile').value = '';
        loadChat();
      } catch (err) {
        alert('خطا در ارسال پاسخ: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'ارسال پاسخ';
      }
    }
  </script>
</body>
</html>
